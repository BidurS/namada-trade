<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NamadaTrade: NAM price, holders, staking and Osmosis depth</title>
    <meta name="description" content="NAM price, who holds it, how much is staked, shielded or on Osmosis, and what a trade costs. Every number shows its source and age." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme before first paint: localStorage['nt.theme'] is dark, light or system; dark by default.
      // Dark is the attribute left unset (tokens.css: "Unset means dark").
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('nt.theme');
          if (s === 'light' || s === 'dark') t = s;
          else if (s === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <style>
      /* Critical ground until the stylesheet arrives: the black (or paper) page, no white flash.
         The layer order repeats tokens.css so this rule stays inside the cascade layers. */
      @layer reset, tokens, base, components, utilities;
      @layer base {
        html { background: #000; color: #f5f5f5; color-scheme: dark; }
        html[data-theme="light"] { background: #f4f4f2; color: #000; color-scheme: light; }
        body { margin: 0; }
      }
    </style>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
